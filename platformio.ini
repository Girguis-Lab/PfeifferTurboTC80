; Development configuration for PfeifferTurboTC80. Consumers do not need this
; file; it exists so the protocol layer can be unit tested on the host.
;
;   pio test -e native      run the protocol tests on this machine
;
; The examples are built with `pio ci` instead, since a library has no
; setup()/loop() of its own to link against:
;
;   pio ci --lib=. --board=megaADK --project-option="build_flags=-Wall -Wextra" examples/BasicQuery
;
; See .github/workflows/ci.yml for the full matrix.

[env:native]
platform = native
test_framework = unity
; pio test does not compile src/ unless asked; the protocol layer lives there.
test_build_src = yes
lib_deps =
    fabiobatsilva/ArduinoFake@^0.4.0
    wizard97/RingBufCPP@^1.3
; The protocol layer is pure logic and portable. The debug tables are not: they
; use AVR pgmspace, so they are switched off for the host build.
build_flags =
    -std=gnu++11
    -Wno-missing-template-arg-list-after-template-kw
    -Isrc
    -D PFEIFFER_VAC_PROTOCOL_INCLUDE_DEBUG=0
; Only the protocol layer is host-testable. The driver and transport need a
; real UART, and are covered by the example builds in CI.
build_src_filter =
    -<*>
    +<PfeifferVacProtocolFuncs.cpp>
